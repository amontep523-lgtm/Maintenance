<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance Spare Parts Inventory</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div id="app"></div>

    <script>
        // ============ DATA ============
        const users = [
            { id: 1, name: 'Manager', role: 'Manager' },
            { id: 2, name: 'Supervisor', role: 'Supervisor' },
            { id: 3, name: 'Admin', role: 'Admin' }
        ];

        const defaultDB = {
            JABABEKA: {
                parts: [],
                transactions: []
            },
            DELTA: {
                parts: [],
                transactions: []
            }
        };

        // ============ STATE ============
        let app = {
            screen: 'login', // login, location, main
            user: null,
            location: null,
            db: JSON.parse(localStorage.getItem('mainDB') || JSON.stringify(defaultDB)),
            page: 'dashboard',
            searchTerm: '',
            showAddForm: false,
            imageModal: null,
            editingPart: null,
            editImage: null
        };

        // ============ SAVE ============
        const save = () => localStorage.setItem('mainDB', JSON.stringify(app.db));

        // ============ EXPORT/IMPORT ============
        const downloadCSV = (filename, data) => {
            // Convert array of objects to CSV string
            const headers = Object.keys(data[0] || {});
            const csvContent = [
                headers.map(h => `"${h}"`).join(','),
                ...data.map(row => headers.map(h => {
                    const val = row[h] || '';
                    return `"${String(val).replace(/"/g, '""')}"`;
                }).join(','))
            ].join('\n');
            
            // Create blob and download
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.click();
            URL.revokeObjectURL(link.href);
        };

        const exportToExcel = () => {
            const location = app.location;
            const loc = app.db[location];
            
            // 1. INVENTORY REPORT - Part details with Name, Machine, Stock
            const inventoryData = loc.parts.map(p => ({
                'Part Number': p.partNumber,
                'Part Name': p.name,
                'Machine/Equipment': p.machine,
                'Current Stock': p.stock,
                'Min Stock': p.min,
                'Max Stock': p.max,
                'Reorder Point': p.reorder,
                'Cost (Rp)': p.cost,
                'Total Value (Rp)': p.stock * p.cost,
                'Last Check': formatDate(p.lastCheck),
                'Check Days': p.checkDays
            }));

            // 2. TRANSACTIONS REPORT
            const transData = loc.transactions.map(t => {
                const part = loc.parts.find(x => x.id === t.partId);
                return {
                    'Date': formatDate(t.time),
                    'Part Number': part ? part.partNumber : 'Unknown',
                    'Part Name': part ? part.name : 'Unknown',
                    'Machine': part ? part.machine : 'Unknown',
                    'Type': t.type,
                    'Quantity': t.qty,
                    'Stock Before': t.before,
                    'Stock After': t.after,
                    'Cost Per Unit (Rp)': part ? part.cost : 0,
                    'Transaction Value (Rp)': (part ? part.cost : 0) * t.qty
                };
            });

            // 3. SUMMARY REPORT
            const now = new Date();
            const currentMonth = now.getMonth();
            const currentYear = now.getFullYear();
            
            const monthTrans = loc.transactions.filter(t => {
                const d = new Date(t.time);
                return d.getMonth() === currentMonth && d.getFullYear() === currentYear;
            });
            const monthReceived = monthTrans.filter(t => t.type === 'RECEIVE').reduce((s, t) => s + t.qty, 0);
            const monthIssued = monthTrans.filter(t => t.type === 'ISSUE').reduce((s, t) => s + t.qty, 0);
            
            const yearTrans = loc.transactions.filter(t => {
                const d = new Date(t.time);
                return d.getFullYear() === currentYear;
            });
            const yearReceived = yearTrans.filter(t => t.type === 'RECEIVE').reduce((s, t) => s + t.qty, 0);
            const yearIssued = yearTrans.filter(t => t.type === 'ISSUE').reduce((s, t) => s + t.qty, 0);

            const summaryData = [
                { Metric: 'Location', Value: location },
                { Metric: 'Export Date', Value: new Date().toLocaleString('en-US') },
                { Metric: '', Value: '' },
                { Metric: 'TOTAL PARTS', Value: loc.parts.length },
                { Metric: 'Total Stock Value (Rp)', Value: loc.parts.reduce((s, p) => s + p.stock * p.cost, 0) },
                { Metric: '', Value: '' },
                { Metric: `This Month (${new Date().toLocaleString('en-US', { month: 'long' })})`, Value: '' },
                { Metric: 'Items Received', Value: monthReceived },
                { Metric: 'Items Issued', Value: monthIssued },
                { Metric: 'Net (Received - Issued)', Value: monthReceived - monthIssued },
                { Metric: '', Value: '' },
                { Metric: `This Year (${currentYear})`, Value: '' },
                { Metric: 'Items Received', Value: yearReceived },
                { Metric: 'Items Issued', Value: yearIssued },
                { Metric: 'Net (Received - Issued)', Value: yearReceived - yearIssued }
            ];

            try {
                const date = new Date().toISOString().split('T')[0];
                
                // Download all 3 CSV files
                downloadCSV(`1_Inventory_${location}_${date}.csv`, inventoryData);
                
                setTimeout(() => {
                    downloadCSV(`2_Transactions_${location}_${date}.csv`, transData);
                }, 500);
                
                setTimeout(() => {
                    downloadCSV(`3_Summary_${location}_${date}.csv`, summaryData);
                }, 1000);
                
                alert('✅ Success! 3 CSV files downloaded:\n\n1. Inventory (Part Name, Machine, Stock)\n2. Transactions\n3. Summary\n\nOpen with Excel or Google Sheets');
            } catch (err) {
                alert('❌ Export error: ' + err.message);
                console.error(err);
            }
        };

        const exportBackup = () => {
            try {
                const backup = {
                    timestamp: new Date().toISOString(),
                    version: 'V5.1',
                    data: app.db
                };
                const dataStr = JSON.stringify(backup, null, 2);
                const dataBlob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(dataBlob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `Maintenance_Backup_${new Date().toISOString().split('T')[0]}.json`;
                link.click();
                URL.revokeObjectURL(url);
                alert('✅ Backup file downloaded successfully!\n\nKeep this file safe!');
            } catch (err) {
                alert('❌ Backup error: ' + err.message);
            }
        };

        const importBackup = () => {
            try {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.json';
                input.onchange = e => {
                    const file = e.target.files[0];
                    if (!file) return;
                    
                    const reader = new FileReader();
                    reader.onload = event => {
                        try {
                            const backup = JSON.parse(event.target.result);
                            if (backup.data && backup.data.JABABEKA && backup.data.DELTA) {
                                if (confirm('⚠️ This will replace all current data with backup.\n\nContinue?')) {
                                    app.db = backup.data;
                                    save();
                                    alert('✅ Data restored from backup successfully!');
                                    render();
                                }
                            } else {
                                alert('❌ Invalid backup file format');
                            }
                        } catch (err) {
                            alert('❌ Error reading backup file:\n' + err.message);
                        }
                    };
                    reader.readAsText(file);
                };
                input.click();
            } catch (err) {
                alert('❌ Error: ' + err.message);
            }
        };

        // ============ EDIT PART ============
        const editPart = id => {
            const part = app.db[app.location].parts.find(p => p.id === id);
            if (part) {
                app.editingPart = JSON.parse(JSON.stringify(part));
                app.editImage = part.image;
                render();
            }
        };

        const savePart = () => {
            if (!app.editingPart) return;

            const part = app.db[app.location].parts.find(p => p.id === app.editingPart.id);
            if (!part) return;

            // Validation
            const min = parseInt(app.editingPart.min) || 0;
            const reorder = parseInt(app.editingPart.reorder) || 0;
            const max = parseInt(app.editingPart.max) || 0;

            if (min < 0 || reorder < 0 || max < 0) {
                alert('❌ Numbers must be >= 0');
                return;
            }

            if (reorder < min) {
                alert('❌ Reorder Point must be >= Min Stock');
                return;
            }

            if (max < reorder) {
                alert('❌ Max Stock must be >= Reorder Point');
                return;
            }

            // Update part
            part.min = min;
            part.max = max;
            part.reorder = reorder;
            part.image = app.editImage;

            save();
            app.editingPart = null;
            app.editImage = null;
            alert('✅ Part updated successfully!');
            render();
        };

        const cancelEdit = () => {
            app.editingPart = null;
            app.editImage = null;
            render();
        };
        const deletePart = id => {
            const part = app.db[app.location].parts.find(p => p.id === id);
            if (!part) return;
            
            const hasTrans = app.db[app.location].transactions.some(t => t.partId === id);
            let msg = `Delete "${part.name}" (${part.partNumber})?`;
            if (hasTrans) msg += '\n\n⚠️ Warning: This part has transaction history.';
            msg += '\n\nThis action cannot be undone.';
            
            if (confirm(msg)) {
                app.db[app.location].parts = app.db[app.location].parts.filter(p => p.id !== id);
                save();
                alert(`✅ Part "${part.name}" deleted.`);
                render();
            }
        };

        // ============ UTILS ============
        const formatDate = t => new Date(t).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
        const daysSince = t => Math.floor((Date.now() - t) / (24*60*60*1000));
        const status = p => {
            if (p.stock === 0) return 'Out of Stock';
            if (p.stock <= p.min) return 'Critical';
            if (p.stock <= p.reorder) return 'Low Stock';
            if (p.stock > p.max) return 'Overstock';
            if (daysSince(p.lastCheck) > p.checkDays) return 'Overdue Check';
            return 'Normal';
        };

        const statusColor = {
            'Normal': 'bg-green-100 text-green-800',
            'Low Stock': 'bg-amber-100 text-amber-800',
            'Critical': 'bg-red-100 text-red-800',
            'Out of Stock': 'bg-red-200 text-red-900',
            'Overstock': 'bg-blue-100 text-blue-800',
            'Overdue Check': 'bg-yellow-100 text-yellow-800'
        };

        // ============ RENDER ============
        const render = () => {
            const appDiv = document.getElementById('app');
            
            if (app.screen === 'login') {
                appDiv.innerHTML = `
                    <div class="min-h-screen bg-gradient-to-br from-slate-900 to-slate-800 flex items-center justify-center p-4">
                        <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
                            <div class="text-center mb-8">
                                <div class="text-5xl mb-3">⚙️</div>
                                <h1 class="text-3xl font-bold text-slate-900 mb-2">Maintenance</h1>
                                <p class="text-slate-600">Spare Parts Inventory System</p>
                            </div>
                            <div class="space-y-3">
                                <button onclick="app.user=users[0];app.screen='location';render()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg">Login as Manager</button>
                                <button onclick="app.user=users[1];app.screen='location';render()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg">Login as Supervisor</button>
                                <button onclick="app.user=users[2];app.screen='location';render()" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-4 rounded-lg">Login as Admin</button>
                            </div>
                            <div class="mt-6 pt-6 border-t border-gray-200 text-sm text-gray-600">
                                <p class="font-bold text-blue-600 mb-2">🚀 Getting Started:</p>
                                <p class="mb-2">1. Login with any user</p>
                                <p class="mb-2">2. Choose location (JABABEKA or DELTA)</p>
                                <p class="mb-2">3. Go to <strong>Parts Inventory</strong></p>
                                <p class="mb-2">4. Click <strong>➕ Add New Part</strong></p>
                                <p class="mb-2">5. Fill in part details & save</p>
                                <p class="text-xs text-gray-500 mt-3">💡 Tip: Use <strong>Backup</strong> to save your data!</p>
                            </div>
                        </div>
                    </div>
                `;
            } else if (app.screen === 'location') {
                appDiv.innerHTML = `
                    <div class="min-h-screen bg-gradient-to-br from-slate-100 to-slate-200 flex items-center justify-center p-4">
                        <div class="w-full max-w-2xl">
                            <div class="text-center mb-12">
                                <h1 class="text-4xl font-bold text-slate-900 mb-2">Select Location</h1>
                                <p class="text-slate-600">Welcome ${app.user.name}</p>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
                                <div onclick="app.location='JABABEKA';app.screen='main';app.page='dashboard';render()" class="bg-gradient-to-br from-orange-400 to-amber-500 rounded-2xl p-8 cursor-pointer hover:shadow-2xl transform hover:scale-105 transition">
                                    <div class="text-center text-white">
                                        <div class="text-6xl mb-4">🟠</div>
                                        <h2 class="text-3xl font-bold mb-2">JABABEKA</h2>
                                        <p class="opacity-90 mb-4">Jababeka Factory</p>
                                        <div class="bg-white bg-opacity-20 rounded-lg p-4">
                                            <p class="text-sm">📦 ${app.db.JABABEKA.parts.length} Parts</p>
                                            <p class="text-sm">💰 Rp${app.db.JABABEKA.parts.reduce((s,p) => s + p.stock*p.cost, 0).toLocaleString('id-ID')}</p>
                                        </div>
                                    </div>
                                </div>
                                <div onclick="app.location='DELTA';app.screen='main';app.page='dashboard';render()" class="bg-gradient-to-br from-blue-400 to-cyan-500 rounded-2xl p-8 cursor-pointer hover:shadow-2xl transform hover:scale-105 transition">
                                    <div class="text-center text-white">
                                        <div class="text-6xl mb-4">🔵</div>
                                        <h2 class="text-3xl font-bold mb-2">DELTA</h2>
                                        <p class="opacity-90 mb-4">Delta Factory</p>
                                        <div class="bg-white bg-opacity-20 rounded-lg p-4">
                                            <p class="text-sm">📦 ${app.db.DELTA.parts.length} Parts</p>
                                            <p class="text-sm">💰 Rp${app.db.DELTA.parts.reduce((s,p) => s + p.stock*p.cost, 0).toLocaleString('id-ID')}</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="text-center">
                                <button onclick="app.screen='login';render()" class="text-slate-600 hover:text-slate-900 font-bold">Logout</button>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                const isJababeka = app.location === 'JABABEKA';
                const headerColor = isJababeka ? 'from-orange-600 to-amber-600' : 'from-blue-600 to-cyan-600';
                const loc = app.db[app.location];
                const navBorder = isJababeka ? 'orange' : 'blue';

                appDiv.innerHTML = `
                    <div class="min-h-screen bg-gray-50">
                        <!-- Header -->
                        <div class="bg-gradient-to-r ${headerColor} text-white shadow-lg sticky top-0 z-40">
                            <div class="max-w-7xl mx-auto px-4 py-4">
                                <div class="flex justify-between items-center">
                                    <div><h1 class="text-2xl font-bold">${app.location}</h1><p class="text-sm opacity-90">${app.user.name}</p></div>
                                    <div class="space-x-2">
                                        <button onclick="app.screen='location';render()" class="bg-white bg-opacity-20 hover:bg-opacity-30 text-white font-bold py-2 px-3 rounded text-sm">Change</button>
                                        <button onclick="app.screen='login';render()" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-3 rounded text-sm">Logout</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Nav -->
                        <div class="bg-white border-b border-gray-200 sticky top-16 z-40 overflow-x-auto">
                            <div class="max-w-7xl mx-auto px-4 flex gap-1">
                                <button onclick="app.page='dashboard';render()" class="px-4 py-4 font-semibold whitespace-nowrap border-b-2 ${app.page==='dashboard' ? `border-${navBorder}-600 text-${navBorder}-600` : 'border-transparent text-gray-600'} hover:text-gray-900">📊 Dashboard</button>
                                <button onclick="app.page='parts';render()" class="px-4 py-4 font-semibold whitespace-nowrap border-b-2 ${app.page==='parts' ? `border-${navBorder}-600 text-${navBorder}-600` : 'border-transparent text-gray-600'} hover:text-gray-900">📦 Parts</button>
                                <button onclick="app.page='receive';render()" class="px-4 py-4 font-semibold whitespace-nowrap border-b-2 ${app.page==='receive' ? `border-${navBorder}-600 text-${navBorder}-600` : 'border-transparent text-gray-600'} hover:text-gray-900">➕ Receive</button>
                                <button onclick="app.page='issue';render()" class="px-4 py-4 font-semibold whitespace-nowrap border-b-2 ${app.page==='issue' ? `border-${navBorder}-600 text-${navBorder}-600` : 'border-transparent text-gray-600'} hover:text-gray-900">➖ Issue</button>
                                <button onclick="app.page='verify';render()" class="px-4 py-4 font-semibold whitespace-nowrap border-b-2 ${app.page==='verify' ? `border-${navBorder}-600 text-${navBorder}-600` : 'border-transparent text-gray-600'} hover:text-gray-900">📋 Check</button>
                                <button onclick="app.page='history';render()" class="px-4 py-4 font-semibold whitespace-nowrap border-b-2 ${app.page==='history' ? `border-${navBorder}-600 text-${navBorder}-600` : 'border-transparent text-gray-600'} hover:text-gray-900">📜 History</button>
                                <button onclick="app.page='reports';render()" class="px-4 py-4 font-semibold whitespace-nowrap border-b-2 ${app.page==='reports' ? `border-${navBorder}-600 text-${navBorder}-600` : 'border-transparent text-gray-600'} hover:text-gray-900">📈 Reports</button>
                            </div>
                        </div>

                        <!-- Content -->
                        <div class="max-w-7xl mx-auto px-4 py-8">
                            ${renderPage(loc)}
                        </div>

                        ${app.imageModal ? `
                            <div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50" onclick="app.imageModal=null;render()">
                                <div class="bg-white rounded-lg p-6" onclick="event.stopPropagation()">
                                    <img src="${app.imageModal}" alt="Part" class="max-h-96 rounded-lg">
                                </div>
                            </div>
                        ` : ''}

                        ${app.editingPart ? `
                            <div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                                <div class="bg-white rounded-lg p-8 max-w-md w-full max-h-96 overflow-y-auto" onclick="event.stopPropagation()">
                                    <h2 class="text-2xl font-bold mb-6">Edit Part: ${app.editingPart.partNumber}</h2>
                                    
                                    <div class="space-y-4">
                                        <!-- Image Section -->
                                        <div class="border-2 border-dashed border-blue-300 rounded-lg p-4 bg-blue-50">
                                            <label class="block text-sm font-bold mb-2">📸 Image</label>
                                            ${app.editImage ? `
                                                <div class="mb-3">
                                                    <img src="${app.editImage}" class="h-24 rounded mb-2">
                                                    <button onclick="app.editImage=null;render()" class="text-red-600 text-sm font-bold">❌ Remove Image</button>
                                                </div>
                                            ` : ''}
                                            <input type="file" id="editImageInput" accept="image/*" class="block w-full text-sm">
                                        </div>

                                        <!-- Min Stock -->
                                        <div>
                                            <label class="block text-sm font-bold mb-1">Min Stock:</label>
                                            <input type="number" id="editMin" value="${app.editingPart.min}" class="w-full px-3 py-2 border rounded">
                                        </div>

                                        <!-- Max Stock -->
                                        <div>
                                            <label class="block text-sm font-bold mb-1">Max Stock:</label>
                                            <input type="number" id="editMax" value="${app.editingPart.max}" class="w-full px-3 py-2 border rounded">
                                        </div>

                                        <!-- Reorder Point -->
                                        <div>
                                            <label class="block text-sm font-bold mb-1">Reorder Point:</label>
                                            <input type="number" id="editReorder" value="${app.editingPart.reorder}" class="w-full px-3 py-2 border rounded">
                                        </div>

                                        <!-- Buttons -->
                                        <div class="space-x-2 flex mt-6">
                                            <button onclick="savePart()" class="flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">✅ Save</button>
                                            <button onclick="cancelEdit()" class="flex-1 bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded">✕ Cancel</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        ` : ''}
                    </div>
                `;

                // Add event listeners after render
                setTimeout(() => {
                    // Search
                    const searchInput = document.getElementById('searchInput');
                    if (searchInput) searchInput.addEventListener('input', e => { app.searchTerm = e.target.value; render(); });
                    
                    // Image upload
                    const imageInput = document.getElementById('imageInput');
                    if (imageInput) {
                        imageInput.addEventListener('change', e => {
                            const f = e.target.files[0];
                            if (f) {
                                const r = new FileReader();
                                r.onload = () => {
                                    const preview = document.getElementById('imagePreview');
                                    if (preview) preview.innerHTML = `<img src="${r.result}" class="h-24 rounded mt-2"><button class="text-red-600 text-sm mt-1" onclick="document.getElementById('imageInput').value='';document.getElementById('currentImage').value='';document.getElementById('imagePreview').innerHTML='';">Remove</button>`;
                                    document.getElementById('currentImage').value = r.result;
                                };
                                r.readAsDataURL(f);
                            }
                        });
                    }

                    // Edit Image upload
                    const editImageInput = document.getElementById('editImageInput');
                    if (editImageInput) {
                        editImageInput.addEventListener('change', e => {
                            const f = e.target.files[0];
                            if (f) {
                                const r = new FileReader();
                                r.onload = () => {
                                    app.editImage = r.result;
                                    render();
                                };
                                r.readAsDataURL(f);
                            }
                        });
                    }

                    // Edit form inputs
                    const editMinInput = document.getElementById('editMin');
                    const editMaxInput = document.getElementById('editMax');
                    const editReorderInput = document.getElementById('editReorder');
                    
                    if (editMinInput) editMinInput.addEventListener('input', e => { app.editingPart.min = parseInt(e.target.value) || 0; });
                    if (editMaxInput) editMaxInput.addEventListener('input', e => { app.editingPart.max = parseInt(e.target.value) || 0; });
                    if (editReorderInput) editReorderInput.addEventListener('input', e => { app.editingPart.reorder = parseInt(e.target.value) || 0; });

                    // Verify inputs
                    document.querySelectorAll('.verifyInput').forEach(input => {
                        input.addEventListener('input', e => {
                            const id = parseInt(e.target.dataset.id);
                            const phys = parseInt(e.target.value) || 0;
                            const part = loc.parts.find(p => p.id === id);
                            if (part) {
                                const diff = phys - part.stock;
                                const elem = document.getElementById(`diff-${id}`);
                                if (elem) elem.textContent = diff === 0 ? '✓' : (diff > 0 ? '+' : '') + diff;
                            }
                        });
                    });
                }, 0);
            }
        };

        // ============ PAGES ============
        const renderPage = loc => {
            if (app.page === 'dashboard') {
                const stats = {
                    normal: loc.parts.filter(p => status(p) === 'Normal').length,
                    low: loc.parts.filter(p => status(p) === 'Low Stock').length,
                    critical: loc.parts.filter(p => status(p) === 'Critical').length,
                    out: loc.parts.filter(p => status(p) === 'Out of Stock').length,
                    value: loc.parts.reduce((s, p) => s + p.stock * p.cost, 0)
                };

                return `
                    <div class="space-y-6">
                        <h1 class="text-4xl font-bold">Dashboard</h1>
                        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                            <div class="bg-white rounded-lg p-6 shadow">
                                <p class="text-gray-600 text-sm">Normal</p>
                                <p class="text-3xl font-bold text-green-600 mt-2">${stats.normal}</p>
                            </div>
                            <div class="bg-white rounded-lg p-6 shadow">
                                <p class="text-gray-600 text-sm">Low Stock</p>
                                <p class="text-3xl font-bold text-amber-600 mt-2">${stats.low}</p>
                            </div>
                            <div class="bg-white rounded-lg p-6 shadow">
                                <p class="text-gray-600 text-sm">Critical</p>
                                <p class="text-3xl font-bold text-red-600 mt-2">${stats.critical}</p>
                            </div>
                            <div class="bg-white rounded-lg p-6 shadow">
                                <p class="text-gray-600 text-sm">Total Value</p>
                                <p class="text-2xl font-bold text-slate-900 mt-2">Rp${stats.value.toLocaleString('id-ID')}</p>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <button onclick="app.page='issue';render()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-6 rounded-lg">➖ Issue Part</button>
                            <button onclick="app.page='receive';render()" class="bg-green-600 hover:bg-green-700 text-white font-bold py-4 px-6 rounded-lg">➕ Receive Part</button>
                            <button onclick="app.page='verify';render()" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-4 px-6 rounded-lg">📋 Stock Check</button>
                        </div>
                    </div>
                `;
            } else if (app.page === 'parts') {
                let filtered = loc.parts;
                if (app.searchTerm) filtered = filtered.filter(p => p.partNumber.toLowerCase().includes(app.searchTerm.toLowerCase()) || p.name.toLowerCase().includes(app.searchTerm.toLowerCase()));

                return `
                    <div class="bg-white rounded-lg p-6 shadow">
                        <div class="flex justify-between items-center mb-6">
                            <h1 class="text-3xl font-bold">Parts Inventory</h1>
                            <div class="space-x-2">
                                <button onclick="app.showAddForm=!app.showAddForm;render()" class="${app.showAddForm ? 'bg-red-600' : 'bg-blue-600'} text-white font-bold py-2 px-4 rounded">
                                    ${app.showAddForm ? '✕ Cancel' : '➕ Add New Part'}
                                </button>
                                <button onclick="exportToExcel()" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">📥 Export CSV</button>
                                <button onclick="exportBackup()" class="bg-cyan-600 hover:bg-cyan-700 text-white font-bold py-2 px-4 rounded">💾 Backup</button>
                                <button onclick="importBackup()" class="bg-amber-600 hover:bg-amber-700 text-white font-bold py-2 px-4 rounded">📤 Restore</button>
                            </div>
                        </div>

                        ${app.showAddForm ? `
                            <div class="bg-blue-50 p-6 rounded-lg mb-6 border-2 border-blue-200">
                                <h2 class="text-2xl font-bold mb-6">Add New Spare Part</h2>
                                <div class="mb-4 p-4 bg-white rounded border-2 border-dashed border-blue-300">
                                    <label class="block text-sm font-bold mb-2">📸 Part Image</label>
                                    <input type="file" id="imageInput" accept="image/*" class="block w-full text-sm">
                                    <div id="imagePreview"></div>
                                    <input type="hidden" id="currentImage" value="">
                                </div>
                                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-6">
                                    <input type="text" id="addPartNumber" placeholder="Part #" class="px-4 py-2 border rounded">
                                    <input type="text" id="addName" placeholder="Name" class="px-4 py-2 border rounded">
                                    <input type="text" id="addMachine" placeholder="Machine" class="px-4 py-2 border rounded">
                                    <input type="text" id="addBrand" placeholder="Brand" class="px-4 py-2 border rounded">
                                    <input type="number" id="addMin" value="5" placeholder="Min" class="px-4 py-2 border rounded">
                                    <input type="number" id="addMax" value="20" placeholder="Max" class="px-4 py-2 border rounded">
                                    <input type="number" id="addReorder" value="7" placeholder="Reorder" class="px-4 py-2 border rounded">
                                    <input type="number" id="addCheckDays" value="7" placeholder="Check Days" class="px-4 py-2 border rounded">
                                    <input type="number" id="addCost" value="0" placeholder="Cost" class="px-4 py-2 border rounded">
                                </div>
                                <button onclick="addPart()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded">✅ Create Part</button>
                            </div>
                        ` : ''}

                        <div class="mb-6">
                            <input type="text" id="searchInput" placeholder="Search..." value="${app.searchTerm}" class="w-full px-4 py-2 border rounded-lg">
                        </div>

                        <div class="overflow-x-auto">
                            <table class="w-full text-sm">
                                <thead class="bg-gray-100">
                                    <tr>
                                        <th class="px-3 py-2 text-center">Image</th>
                                        <th class="px-3 py-2 text-left">Part #</th>
                                        <th class="px-3 py-2 text-left">Name</th>
                                        <th class="px-3 py-2 text-left">Machine</th>
                                        <th class="px-3 py-2 text-center">Stock</th>
                                        <th class="px-3 py-2 text-center">Last Check</th>
                                        <th class="px-3 py-2 text-center">Status</th>
                                        <th class="px-3 py-2 text-center">Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${filtered.map(p => `
                                        <tr class="border-b hover:bg-gray-50">
                                            <td class="px-3 py-2 text-center">
                                                ${p.image ? `<img src="${p.image}" class="w-12 h-12 rounded cursor-pointer mx-auto" onclick="app.imageModal='${p.image}';render()">` : '<span class="text-xs text-gray-500">No Image</span>'}
                                            </td>
                                            <td class="px-3 py-2 font-bold text-blue-600">${p.partNumber}</td>
                                            <td class="px-3 py-2">${p.name}</td>
                                            <td class="px-3 py-2 text-xs text-gray-600">${p.machine}</td>
                                            <td class="px-3 py-2 text-center font-bold">${p.stock}</td>
                                            <td class="px-3 py-2 text-center text-xs text-gray-600">${formatDate(p.lastCheck)}</td>
                                            <td class="px-3 py-2 text-center"><span class="px-2 py-1 rounded text-xs font-bold ${statusColor[status(p)]}">${status(p)}</span></td>
                                            <td class="px-3 py-2 text-center space-x-1">
                                                <button onclick="editPart(${p.id})" class="bg-blue-600 hover:bg-blue-700 text-white px-2 py-1 rounded text-xs font-bold">✏️ Edit</button>
                                                <button onclick="deletePart(${p.id})" class="bg-red-600 hover:bg-red-700 text-white px-2 py-1 rounded text-xs font-bold">🗑️ Delete</button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            } else if (app.page === 'receive') {
                return `
                    <div class="bg-white rounded-lg p-6 shadow max-w-md">
                        <h1 class="text-3xl font-bold mb-6">➕ Receive Parts</h1>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-bold mb-2">Part *</label>
                                <select id="receivePart" class="w-full px-4 py-2 border rounded">
                                    <option value="">-- Select --</option>
                                    ${loc.parts.map(p => `<option value="${p.id}">${p.partNumber} - ${p.name}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-bold mb-2">Quantity *</label>
                                <input type="number" id="receiveQty" min="1" class="w-full px-4 py-2 border rounded">
                            </div>
                            <button onclick="receiveAction()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded">✅ Record Receipt</button>
                        </div>
                    </div>
                `;
            } else if (app.page === 'issue') {
                return `
                    <div class="bg-white rounded-lg p-6 shadow max-w-md">
                        <h1 class="text-3xl font-bold mb-6">➖ Issue Parts</h1>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-bold mb-2">Part *</label>
                                <select id="issuePart" class="w-full px-4 py-2 border rounded">
                                    <option value="">-- Select --</option>
                                    ${loc.parts.filter(p => p.stock > 0).map(p => `<option value="${p.id}">${p.partNumber} - ${p.name} (${p.stock})</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-bold mb-2">Quantity *</label>
                                <input type="number" id="issueQty" min="1" class="w-full px-4 py-2 border rounded">
                            </div>
                            <button onclick="issueAction()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded">✅ Record Issue</button>
                        </div>
                    </div>
                `;
            } else if (app.page === 'verify') {
                const overdue = loc.parts.filter(p => daysSince(p.lastCheck) > p.checkDays);
                return `
                    <div class="bg-white rounded-lg p-6 shadow">
                        <h1 class="text-3xl font-bold mb-6">📋 Stock Verification</h1>
                        <div class="overflow-x-auto">
                            <table class="w-full text-sm">
                                <thead class="bg-gray-100">
                                    <tr>
                                        <th class="px-3 py-2 text-center">Image</th>
                                        <th class="px-3 py-2 text-left">Part #</th>
                                        <th class="px-3 py-2 text-left">Name</th>
                                        <th class="px-3 py-2 text-center">System</th>
                                        <th class="px-3 py-2 text-center">Physical</th>
                                        <th class="px-3 py-2 text-center" id="diff-header">Diff</th>
                                        <th class="px-3 py-2 text-center">Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${overdue.map(p => `
                                        <tr class="border-b hover:bg-gray-50">
                                            <td class="px-3 py-2 text-center">
                                                ${p.image ? `<img src="${p.image}" class="w-10 h-10 rounded cursor-pointer mx-auto" onclick="app.imageModal='${p.image}';render()">` : '<span class="text-xs text-gray-500">-</span>'}
                                            </td>
                                            <td class="px-3 py-2 font-bold text-blue-600">${p.partNumber}</td>
                                            <td class="px-3 py-2">${p.name}</td>
                                            <td class="px-3 py-2 text-center font-bold">${p.stock}</td>
                                            <td class="px-3 py-2"><input type="number" min="0" class="verifyInput w-20 px-2 py-1 border rounded text-center" data-id="${p.id}"></td>
                                            <td class="px-3 py-2 text-center font-bold" id="diff-${p.id}">-</td>
                                            <td class="px-3 py-2 text-center"><button onclick="verifyPart(${p.id})" class="bg-purple-600 text-white px-2 py-1 rounded text-xs">Confirm</button></td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                        ${overdue.length === 0 ? '<p class="text-center py-8 text-gray-600">✅ All checked!</p>' : ''}
                    </div>
                `;
            } else if (app.page === 'history') {
                const sorted = [...loc.transactions].reverse();
                return `
                    <div class="bg-white rounded-lg p-6 shadow">
                        <h1 class="text-3xl font-bold mb-6">📜 History</h1>
                        <div class="overflow-x-auto">
                            <table class="w-full text-xs">
                                <thead class="bg-gray-100">
                                    <tr>
                                        <th class="px-2 py-2 text-left">Date</th>
                                        <th class="px-2 py-2 text-left">Part</th>
                                        <th class="px-2 py-2 text-center">Type</th>
                                        <th class="px-2 py-2 text-center">Qty</th>
                                        <th class="px-2 py-2 text-center">Before</th>
                                        <th class="px-2 py-2 text-center">After</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${sorted.map(t => {
                                        const p = loc.parts.find(x => x.id === t.partId);
                                        return p ? `
                                            <tr class="border-b hover:bg-gray-50">
                                                <td class="px-2 py-2 text-gray-600">${formatDate(t.time)}</td>
                                                <td class="px-2 py-2 font-bold text-blue-600">${p.partNumber}</td>
                                                <td class="px-2 py-2 text-center">${t.type}</td>
                                                <td class="px-2 py-2 text-center">${t.qty}</td>
                                                <td class="px-2 py-2 text-center">${t.before}</td>
                                                <td class="px-2 py-2 text-center font-bold">${t.after}</td>
                                            </tr>
                                        ` : '';
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            } else if (app.page === 'reports') {
                const now = new Date();
                const currentMonth = now.getMonth();
                const currentYear = now.getFullYear();

                const getMonthYear = t => {
                    const d = new Date(t);
                    return { month: d.getMonth(), year: d.getFullYear() };
                };

                const allTrans = loc.transactions;

                // All time stats
                const allReceived = allTrans.filter(t => t.type === 'RECEIVE').reduce((s, t) => s + t.qty, 0);
                const allIssued = allTrans.filter(t => t.type === 'ISSUE').reduce((s, t) => s + t.qty, 0);
                const allValue = loc.parts.reduce((s, p) => s + p.stock * p.cost, 0);

                // Current month stats
                const monthTrans = allTrans.filter(t => {
                    const d = getMonthYear(t);
                    return d.month === currentMonth && d.year === currentYear;
                });
                const monthReceived = monthTrans.filter(t => t.type === 'RECEIVE').reduce((s, t) => s + t.qty, 0);
                const monthIssued = monthTrans.filter(t => t.type === 'ISSUE').reduce((s, t) => s + t.qty, 0);
                const monthValue = monthTrans.reduce((s, t) => {
                    const p = loc.parts.find(x => x.id === t.partId);
                    return s + (p ? p.cost * t.qty : 0);
                }, 0);

                // Current year stats
                const yearTrans = allTrans.filter(t => {
                    const d = getMonthYear(t);
                    return d.year === currentYear;
                });
                const yearReceived = yearTrans.filter(t => t.type === 'RECEIVE').reduce((s, t) => s + t.qty, 0);
                const yearIssued = yearTrans.filter(t => t.type === 'ISSUE').reduce((s, t) => s + t.qty, 0);
                const yearValue = yearTrans.reduce((s, t) => {
                    const p = loc.parts.find(x => x.id === t.partId);
                    return s + (p ? p.cost * t.qty : 0);
                }, 0);

                const monthName = new Date(currentYear, currentMonth).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

                return `
                    <div class="space-y-8">
                        <h1 class="text-3xl font-bold">Reports</h1>

                        <!-- Current Month -->
                        <div>
                            <h2 class="text-2xl font-bold mb-4">📅 This Month - ${monthName}</h2>
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                                <div class="bg-green-50 rounded-lg p-6 shadow border-l-4 border-green-500">
                                    <p class="text-gray-600 text-sm font-bold">Items Received</p>
                                    <p class="text-2xl font-bold text-green-600 mt-2">${monthReceived}</p>
                                </div>
                                <div class="bg-blue-50 rounded-lg p-6 shadow border-l-4 border-blue-500">
                                    <p class="text-gray-600 text-sm font-bold">Items Issued</p>
                                    <p class="text-2xl font-bold text-blue-600 mt-2">${monthIssued}</p>
                                </div>
                                <div class="bg-amber-50 rounded-lg p-6 shadow border-l-4 border-amber-500">
                                    <p class="text-gray-600 text-sm font-bold">Month Value</p>
                                    <p class="text-xl font-bold text-amber-600 mt-2">Rp${monthValue.toLocaleString('id-ID')}</p>
                                </div>
                                <div class="bg-purple-50 rounded-lg p-6 shadow border-l-4 border-purple-500">
                                    <p class="text-gray-600 text-sm font-bold">Net (Received - Issued)</p>
                                    <p class="text-2xl font-bold text-purple-600 mt-2">${monthReceived - monthIssued}</p>
                                </div>
                            </div>
                        </div>

                        <!-- Current Year -->
                        <div>
                            <h2 class="text-2xl font-bold mb-4">📆 Year ${currentYear}</h2>
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                                <div class="bg-green-50 rounded-lg p-6 shadow border-l-4 border-green-500">
                                    <p class="text-gray-600 text-sm font-bold">Items Received</p>
                                    <p class="text-2xl font-bold text-green-600 mt-2">${yearReceived}</p>
                                </div>
                                <div class="bg-blue-50 rounded-lg p-6 shadow border-l-4 border-blue-500">
                                    <p class="text-gray-600 text-sm font-bold">Items Issued</p>
                                    <p class="text-2xl font-bold text-blue-600 mt-2">${yearIssued}</p>
                                </div>
                                <div class="bg-amber-50 rounded-lg p-6 shadow border-l-4 border-amber-500">
                                    <p class="text-gray-600 text-sm font-bold">Year Value</p>
                                    <p class="text-xl font-bold text-amber-600 mt-2">Rp${yearValue.toLocaleString('id-ID')}</p>
                                </div>
                                <div class="bg-purple-50 rounded-lg p-6 shadow border-l-4 border-purple-500">
                                    <p class="text-gray-600 text-sm font-bold">Net (Received - Issued)</p>
                                    <p class="text-2xl font-bold text-purple-600 mt-2">${yearReceived - yearIssued}</p>
                                </div>
                            </div>
                        </div>

                        <!-- All Time -->
                        <div>
                            <h2 class="text-2xl font-bold mb-4">📊 Total All Time</h2>
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                                <div class="bg-white rounded-lg p-6 shadow">
                                    <p class="text-gray-600 text-sm">Total Received</p>
                                    <p class="text-2xl font-bold text-green-600 mt-2">${allReceived}</p>
                                </div>
                                <div class="bg-white rounded-lg p-6 shadow">
                                    <p class="text-gray-600 text-sm">Total Issued</p>
                                    <p class="text-2xl font-bold text-blue-600 mt-2">${allIssued}</p>
                                </div>
                                <div class="bg-white rounded-lg p-6 shadow">
                                    <p class="text-gray-600 text-sm">Current Stock Value</p>
                                    <p class="text-xl font-bold text-slate-900 mt-2">Rp${allValue.toLocaleString('id-ID')}</p>
                                </div>
                                <div class="bg-white rounded-lg p-6 shadow">
                                    <p class="text-gray-600 text-sm">Net</p>
                                    <p class="text-2xl font-bold text-slate-900 mt-2">${allReceived - allIssued}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }
        };

        // ============ ACTIONS ============
        const addPart = () => {
            const num = (document.getElementById('addPartNumber').value || '').toUpperCase();
            const name = document.getElementById('addName').value;
            if (!num || !name) { alert('Please fill in all required fields'); return; }
            if (app.db[app.location].parts.find(p => p.partNumber === num)) { alert('Part number already exists'); return; }

            const img = document.getElementById('currentImage').value;
            app.db[app.location].parts.push({
                id: Math.max(...app.db[app.location].parts.map(p => p.id), 0) + 1,
                partNumber: num,
                name,
                machine: document.getElementById('addMachine').value || 'General',
                stock: 0,
                min: parseInt(document.getElementById('addMin').value) || 5,
                max: parseInt(document.getElementById('addMax').value) || 20,
                reorder: parseInt(document.getElementById('addReorder').value) || 7,
                cost: parseFloat(document.getElementById('addCost').value) || 0,
                checkDays: parseInt(document.getElementById('addCheckDays').value) || 7,
                lastCheck: Date.now(),
                image: img || null
            });
            save();
            app.showAddForm = false;
            render();
        };

        const receiveAction = () => {
            const id = parseInt(document.getElementById('receivePart').value);
            const qty = parseInt(document.getElementById('receiveQty').value);
            if (!id || !qty) { alert('Please select a part and enter quantity'); return; }

            const p = app.db[app.location].parts.find(x => x.id === id);
            if (!p) return;

            const before = p.stock;
            p.stock += qty;
            app.db[app.location].transactions.push({ partId: id, type: 'RECEIVE', qty, before, after: p.stock, time: Date.now() });
            save();
            alert(`✅ Successfully received ${qty} units of ${p.name}`);
            render();
        };

        const issueAction = () => {
            const id = parseInt(document.getElementById('issuePart').value);
            const qty = parseInt(document.getElementById('issueQty').value);
            if (!id || !qty) { alert('Please select a part and enter quantity'); return; }

            const p = app.db[app.location].parts.find(x => x.id === id);
            if (!p || qty > p.stock) { alert('Insufficient stock available'); return; }

            const before = p.stock;
            p.stock -= qty;
            app.db[app.location].transactions.push({ partId: id, type: 'ISSUE', qty, before, after: p.stock, time: Date.now() });
            save();
            alert(`✅ Successfully issued ${qty} units`);
            render();
        };

        const verifyPart = id => {
            const input = document.querySelector(`input[data-id="${id}"]`);
            const phys = parseInt(input.value);
            if (isNaN(phys)) { alert('Please enter the physical stock count'); return; }

            const p = app.db[app.location].parts.find(x => x.id === id);
            if (!p) return;

            const before = p.stock;
            p.stock = phys;
            p.lastCheck = Date.now();
            const diff = phys - before;
            app.db[app.location].transactions.push({ partId: id, type: 'ADJUST', qty: diff, before, after: phys, time: Date.now() });
            save();
            alert(`✅ Stock verified for ${p.name}\nDifference: ${diff > 0 ? '+' : ''}${diff} units`);
            render();
        };

        // ============ INIT ============
        render();
    </script>
</body>
</html>
